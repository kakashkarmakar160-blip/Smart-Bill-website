<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিক্রির রিপোর্ট</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#17243a}header{background:#101d35;color:white;padding:16px}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e1e8f1;border-radius:14px;padding:17px;margin-bottom:15px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters div{flex:1;min-width:140px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{padding:10px;border:1px solid #d5deea;border-radius:9px;width:100%;font:inherit}button{padding:11px 14px;border:0;border-radius:9px;background:#2457a7;color:white;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.metric{background:#f1f5fb;padding:14px;border-radius:11px}.metric b{display:block;font-size:22px;margin-top:5px}canvas{width:100%;height:260px;border:1px solid #edf0f5;border-radius:10px}
</style></head><body><header><b>Sales & GST Reports</b></header><main class="wrap"><section class="panel"><h2>রিপোর্ট ফিল্টার</h2><div class="filters"><div><label>From Date</label><input type="date" id="fromDate"></div><div><label>To Date</label><input type="date" id="toDate"></div><div><label>রিপোর্ট</label><select id="reportType"><option value="sales">বিক্রি</option><option value="gst">GST</option><option value="discount">Discount</option><option value="bills">বিলের সংখ্যা</option></select></div><button id="showReport">রিপোর্ট দেখুন</button><button id="downloadCsv">CSV ডাউনলোড</button></div></section><section class="panel"><div class="metrics"><div class="metric">মোট বিক্রি<b id="sumSales">₹0.00</b></div><div class="metric">GST<b id="sumGst">₹0.00</b></div><div class="metric">Discount<b id="sumDiscount">₹0.00</b></div><div class="metric">বিল<b id="sumBills">0</b></div></div></section><section class="panel"><h2 id="chartTitle">দৈনিক বিক্রি</h2><canvas id="chart" width="1000" height="300"></canvas></section><section class="panel"><h2>এই রিপোর্টের সারি</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>তারিখ</th><th>বিল</th><th>বিক্রি</th><th>GST</th><th>Discount</th></tr></thead><tbody id="reportRows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/common.js"></script><script src="js/reports.js"></script></body></html>
