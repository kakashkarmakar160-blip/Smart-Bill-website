<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>কাস্টমার</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#17243a}header{background:#101d35;color:white;padding:16px}.wrap{max-width:950px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e1e8f1;border-radius:14px;padding:17px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input{padding:10px;border:1px solid #d5deea;border-radius:9px;width:100%;font:inherit}button{padding:10px 14px;border:0;border-radius:9px;background:#2457a7;color:white;font-weight:700}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e7edf4}.tablewrap{overflow:auto}
</style></head><body><header><b>কাস্টমার ম্যানেজমেন্ট</b></header><main class="wrap"><section class="panel"><h2>কাস্টমার যোগ করুন</h2><div class="grid"><div><label>নাম</label><input id="cName"></div><div><label>মোবাইল</label><input id="cPhone"></div><div><label>ঠিকানা</label><input id="cAddress"></div></div><button id="saveCustomer" style="margin-top:12px">সেভ করুন</button><p id="cStatus"></p></section><section class="panel"><h2>কাস্টমার তালিকা</h2><div class="tablewrap"><table><thead><tr><th>নাম</th><th>মোবাইল</th><th>ঠিকানা</th></tr></thead><tbody id="customersBody"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/common.js"></script><script src="js/customers.js"></script></body></html>
