<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রোডাক্ট</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#17243a}header{background:#101d35;color:white;padding:16px}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e1e8f1;border-radius:14px;padding:17px;margin-bottom:15px}input{padding:10px;border:1px solid #d5deea;border-radius:9px;width:100%;font:inherit}label{font-size:13px;font-weight:700;display:block;margin:9px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}button{padding:10px 14px;border:0;border-radius:9px;background:#2457a7;color:white;font-weight:700}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e7edf4}.tablewrap{overflow:auto}
</style></head><body><header><b>প্রোডাক্ট ম্যানেজমেন্ট</b></header><main class="wrap"><section class="panel"><h2>প্রোডাক্ট যোগ / সম্পাদনা</h2><div class="grid"><div><label>নাম</label><input id="pName"></div><div><label>MRP</label><input id="pMrp" type="number"></div><div><label>ক্রয়মূল্য</label><input id="pCost" type="number"></div><div><label>বিক্রয়মূল্য</label><input id="pPrice" type="number"></div><div><label>স্টক</label><input id="pStock" type="number"></div><div><label>GST (%) — Settings default</label><input id="pGst" type="number"></div></div><button id="saveProduct" style="margin-top:12px">প্রোডাক্ট সেভ</button><p id="pStatus"></p></section><section class="panel"><h2>প্রোডাক্ট তালিকা</h2><div class="tablewrap"><table><thead><tr><th>নাম</th><th>MRP</th><th>বিক্রয়মূল্য</th><th>স্টক</th><th>GST</th></tr></thead><tbody id="productsBody"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/common.js"></script><script src="js/products.js"></script></body></html>
